<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Siva 💌</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#4a1730;
  --card:rgba(255,250,246,.62);
  --pink:#ff5c8a;
  --deep:#b0124f;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Poppins,system-ui,sans-serif;
  color:var(--ink);
  background:#ffc2d4;
  overflow-x:hidden;
}

#base{
  position:fixed;
  inset:0;
  z-index:-5;
  background:linear-gradient(135deg,#ffc2d4,#ff9eb8 50%,#ffd0b0);
}

.bgl{
  position:fixed;
  inset:-6px;
  z-index:-4;
  background-size:cover;
  background-repeat:no-repeat;
  opacity:0;
  transition:opacity 1.4s ease;
  filter:blur(.5px) saturate(1.18) contrast(1.04) brightness(1.06);
}

.bgl.on{opacity:1}

#shade{
  position:fixed;
  inset:0;
  z-index:-3;
  pointer-events:none;
  background:
    radial-gradient(ellipse at center,
    rgba(255,200,218,.05) 45%,
    rgba(190,40,100,.28) 100%),
    linear-gradient(rgba(255,214,228,.12),rgba(255,160,190,.12));
}

.heart{
  position:fixed;
  top:-40px;
  z-index:-2;
  pointer-events:none;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:.6;
  }
}

main{
  max-width:600px;
  margin:0 auto;
  padding:24px 16px 80px;
  text-align:center;
}

h1{
  font-family:'Dancing Script',cursive;
  font-size:2.7rem;
  margin:30px 0 10px;
  color:var(--deep);
  text-shadow:0 2px 10px rgba(255,255,255,.7);
}

#env{
  font-size:7rem;
  cursor:pointer;
  display:inline-block;
  animation:bounce 1.2s infinite;
  user-select:none;
}

@keyframes bounce{
  50%{transform:translateY(-14px) scale(1.05)}
}

.card{
  background:var(--card);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  border-radius:18px;
  padding:22px 20px;
  box-shadow:0 10px 30px rgba(120,20,60,.3);
  margin:18px 0;
  text-align:left;
}

.p{
  font-family:'Dancing Script',cursive;
  font-size:1.4rem;
  line-height:1.5;
  margin:0 0 16px;
  opacity:0;
  transform:translateY(10px);
  transition:opacity .9s,transform .9s;
  white-space:pre-line;
  text-shadow:0 0 8px rgba(255,255,255,.95),
              0 1px 3px rgba(255,255,255,.9);
}

.p.show{
  opacity:1;
  transform:none;
}

.hide{display:none}

h2{
  font-family:'Dancing Script',cursive;
  color:var(--deep);
  margin:0 0 10px;
  text-align:center;
  font-size:1.9rem;
}

ul{
  list-style:none;
  padding:0;
  margin:0;
}

li{
  padding:12px 4px;
  border-bottom:1px dashed #f3b4c6;
  opacity:0;
  transform:translateX(-14px);
  transition:.6s;
}

li:last-child{border:0}

li.show{
  opacity:1;
  transform:none;
}

button{
  font:inherit;
  border:0;
  border-radius:30px;
  padding:12px 26px;
  cursor:pointer;
  font-weight:600;
}

.next{
  background:var(--pink);
  color:#fff;
  margin-top:6px;
  opacity:0;
  pointer-events:none;
  transition:opacity .6s;
  box-shadow:0 4px 14px rgba(176,18,79,.35);
}

.next.show{
  opacity:1;
  pointer-events:auto;
}

#arena{
  position:relative;
  height:170px;
  margin-top:14px;
}

#ok{
  position:absolute;
  left:18%;
  top:10px;
  background:var(--pink);
  color:#fff;
  transition:transform .2s;
}

#no{
  position:absolute;
  left:60%;
  top:10px;
  background:#ececec;
  color:#333;
  transition:left .25s,top .25s;
}

.lock{margin-top:8vh}

.lockicon{
  font-size:4.2rem;
  animation:bounce 1.6s infinite;
}

.lock h2{
  font-size:2.3rem;
  margin-bottom:6px;
}

.lock .q{
  font-size:1.15rem;
  font-weight:600;
  margin:6px 0 4px;
}

.lock .sub{
  font-size:.85rem;
  opacity:.8;
  margin:0 0 16px;
}

#ans{
  width:100%;
  max-width:300px;
  font:inherit;
  font-size:1.1rem;
  text-align:center;
  padding:13px 16px;
  border-radius:30px;
  border:2px solid #ffc0d2;
  outline:none;
  background:rgba(255,255,255,.9);
  color:var(--ink);
}

#ans:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 4px rgba(255,92,138,.2);
}

#openBtn{
  background:var(--pink);
  color:#fff;
  margin-top:14px;
  box-shadow:0 4px 14px rgba(176,18,79,.35);
}

#lockMsg{
  min-height:1.6em;
  margin-top:12px;
  font-weight:600;
  color:var(--deep);
}

.shake{animation:shake .45s}

@keyframes shake{
  20%{transform:translateX(-10px)}
  40%{transform:translateX(10px)}
  60%{transform:translateX(-7px)}
  80%{transform:translateX(7px)}
}

.final{
  font-family:'Dancing Script',cursive;
  font-size:2.3rem;
  color:var(--deep);
  text-align:center;
  line-height:1.4;
  margin:0;
}

.collage{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:14px 10px;
  margin:10px 0 24px;
}

.pol{
  background:#fff;
  padding:8px 8px 26px;
  border-radius:4px;
  box-shadow:0 8px 20px rgba(90,10,50,.35);
  width:calc(50% - 10px);
  max-width:250px;
  transform:rotate(var(--r));
  opacity:0;
  animation:drop .8s ease forwards;
  animation-delay:var(--d);
}

.pol img,.pol video{
  display:block;
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  background:#eee;
}

.pol.big{
  width:calc(62% - 10px);
  max-width:300px;
}

.pol.wide{
  width:calc(86% - 10px);
  max-width:400px;
}

.pol.wide img{aspect-ratio:4/3}

@keyframes drop{
  from{
    opacity:0;
    transform:translateY(-40px) rotate(0);
  }
  to{
    opacity:1;
    transform:rotate(var(--r));
  }
}

@media(max-width:480px){
  main{padding:16px 12px 60px}
  h1{font-size:2.25rem;margin-top:18px}
  #env{font-size:5.5rem}
  .card{padding:18px 15px;border-radius:16px}
  .p{font-size:1.25rem}
  #arena{height:190px}
  #ok,#no{min-height:44px;padding:11px 22px}
  .final{font-size:2rem}
  .pol{width:calc(50% - 8px)}
  .pol.big{width:68%}
  .pol.wide{width:92%}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<div id="base"></div>
<div id="layers"></div>
<div id="shade"></div>

<main>

<section id="s0">
  <div class="card lock" style="text-align:center">
    <div class="lockicon">🔐</div>
    <h2>Siva, oru chinna question 💕</h2>
    <p class="q">Namma love propose panna date enna? 💍</p>
    <p class="sub">Sariyaana date type pannina thaan letter open aagum (DD / MM / YYYY)</p>

    <input id="ans" type="text" inputmode="text"
           autocomplete="off" placeholder="DD / MM / YYYY">

    <br>
    <button id="openBtn" onclick="checkAns()">Open 💌</button>
    <div id="lockMsg"></div>
  </div>
</section>

<section id="s1" class="hide">
  <h1>Siva kaaga 💌</h1>
  <div id="env" onclick="go(2)">💌</div>
</section>

<section id="s2" class="hide">
  <div class="card" id="letter"></div>
  <button class="next" id="n2" onclick="go(3)">Next 💕</button>
</section>

<section id="s3" class="hide">
  <div class="card">
    <h2>Reasons I love you 😍</h2>
    <ul id="reasons"></ul>
  </div>
  <button class="next" id="n3" onclick="go(4)">Next 💕</button>
</section>

<section id="s4" class="hide">
  <div class="card" style="text-align:center">
    <h2>Final question 🥺</h2>
    <p style="font-size:1.15rem;font-weight:600">
      Unaku naan, enaku nee — OK va? 💖
    </p>
    <div id="arena">
      <button id="ok" onclick="go(5)">OK 💖</button>
      <button id="no">No</button>
    </div>
  </div>
</section>

<section id="s5" class="hide">
  <div class="card">
    <p class="final">I LOVE YOU SIVA ❤️<br>Always yours,<br>Pavi 💕</p>
  </div>
  <div class="collage" id="collage"></div>
</section>

</main>

<script>

/* =========================================================
   IMPORTANT:
   Replace the two variables below with the ORIGINAL lines
   from your HTML file to keep all photos and video.
========================================================= */

// Paste your original IMGS variable here
// var IMGS = { ... };

// Paste your original VIDEO variable here
// var VIDEO = "...";

var POS = {
  A:'55% 30%',
  B:'40% 30%',
  C:'22% 30%',
  D:'50% 50%',
  E:'50% 35%',
  F:'50% 40%'
};

var PARAS = [
"My boy 💕\n\nEnaku unna romba pudikum Siva. Anana sonathu illa unta. Nee epovum en kooda irupen nu solum pothu enaku thonum, namala love panna ipadi oru paiyananu.",
"Naan un kooda thaan irupen. Unna vittutu poga maten, avlo easy yalam , na una vitu pona mothama than poven, enaku unna romba pudikum. enavida Bettera vantha poiriviya nu ketpala, athulam poga maten, un kudave thaan irupen.",
"Nee work panra place poi romba feel panatha. Naan unna ninachite thaan irupen. Nee anga poi nalla work pannu, sapdu, anga nadakuratha observe pannu. Aprm nee enna work pannalamnu namma yosipom, ok va?",
"Unkooda pesalana enaku oru mari iruku Siva, en nu theriyala. Namma pirinjiruvomonu bayama iruku. Unaku apdi thonuna enta soliru. Naan unaku pudikathathu panalum enta solu, naan mathipen, ok va?",
"I LOVE YOU SIVA ❤️\n\nNee enna miss panra romba nu enaku theriyum. Naanum unna athavida miss panren. Konja naal aprm ellam sari aagirum.",
"Nee thaan Siva enaku ellame. My friend, my hobby, my heart, my distraction, my boy,my bobby, en chella kutty.",
"Annaiku namma velila pona apo enaku romba happy ya feel achi Siva. Vera yaru kooda ipadi naan happy ya irunthathu illa. First time velila pona apome ivlo comfortable ah feel panathu illa. Ne ena nalla pathupa nu enaku thonichi.",
"Naan unkita niraya time un ex pathi ketpen, enaku ippovum bayama thaan irukum. Enga nee avala paatha maruviyonu. Aana nee poga maatta, apdithana? Unaku naathana elame nu thaan naan ninaichipen. Vittu pogatha Siva. Naan unna edhachum hurt panna enta solu.",
"Naan illanalum, enaku edhachum aagitunalum, un health ah pathukoo. Nalla sapdu, ok va? Siva, enaku edhum aagathu, naan illana una yaru nalla pathupa enayamari, na matum than una nalla pathupen . Itha type panum pothu alugaya varuthu.",
"Your girl,\nPavi 💕"
];

var REASONS = [
"Nee sirikum pothu alaga irupa, sirikalana kooda alaga thaan irupa 😍",
"Naan unkita water keta kooda, nee odane vangi kudupa 💧",
"Naan kovama irunthalum, nee enna samalipa 🥹"
];

/* Background photos */

var layers = {};
var holder = document.getElementById('layers');

Object.keys(IMGS).forEach(function(k){
  var d = document.createElement('div');
  d.className='bgl';
  d.style.backgroundImage = "url('" + IMGS[k] + "')";
  d.style.backgroundPosition = POS[k];

  if(k==='E'){
    d.style.filter='blur(1px) saturate(1.1) brightness(1.05)';
  }

  holder.appendChild(d);
  layers[k] = d;
});

function setBg(k){
  Object.keys(layers).forEach(function(x){
    layers[x].classList.toggle('on',x===k);
  });
}

setBg('F');

/* DATE CHECKING — FIXED */

var MONTHS = [
  'jan','feb','mar','apr','may','jun',
  'jul','aug','sep','oct','nov','dec'
];

function isRightDate(input){

  var s = String(input || '').toLowerCase().trim();
  var m,day,month,year;

  // DDMMYYYY
  if((m=s.match(/^(\d{2})(\d{2})(\d{4})$/))){
    day=Number(m[1]);
    month=Number(m[2]);
    year=Number(m[3]);
  }

  // DD/MM/YYYY, DD-MM-YYYY, MM/DD/YYYY
  else if((m=s.match(/^(\d{1,2})\s*[\/.-]\s*(\d{1,2})\s*[\/.-]\s*(\d{4})$/))){
    var first=Number(m[1]);
    var second=Number(m[2]);
    year=Number(m[3]);

    if(first===13){
      day=first;
      month=second;
    }else{
      month=first;
      day=second;
    }
  }

  // June 13 2026 / 13 June 2026
  else{
    var monthIndex=-1;

    for(var i=0;i<MONTHS.length;i++){
      if(s.indexOf(MONTHS[i])!==-1){
        monthIndex=i+1;
        break;
      }
    }

    var nums=s.match(/\d{1,2}/g);
    var yMatch=s.match(/\d{4}/);

    if(monthIndex<0 || !nums || !yMatch){
      return false;
    }

    year=Number(yMatch[0]);

    var dayNumbers=nums.filter(function(n){
      return n!==yMatch[0];
    });

    day=Number(dayNumbers[0]);
    month=monthIndex;
  }

  return year===2026 && day===13 && month===6;
}

function checkAns(){

  var box=document.getElementById('ans');
  var msg=document.getElementById('lockMsg');

  if(isRightDate(box.value)){
    msg.textContent='Correct da! 😍';
    hearts(30);

    setTimeout(function(){
      go(1);
    },700);

  }else{
    msg.textContent='Hmm… thappu 🥺 nalla yosi, innoru thadava try pannu';

    box.classList.remove('shake');
    void box.offsetWidth;
    box.classList.add('shake');
  }
}

document.getElementById('ans').addEventListener('keydown',function(e){
  if(e.key==='Enter') checkAns();
});

/* HEART ANIMATION */

function hearts(n){

  var set=["💖","💕","💗","❤️","🌸"];

  for(var i=0;i<n;i++){

    var h=document.createElement('div');
    h.className='heart';

    h.textContent=set[Math.floor(Math.random()*set.length)];
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(16+Math.random()*22)+'px';
    h.style.animationDuration=(5+Math.random()*5)+'s';

    document.body.appendChild(h);

    setTimeout(function(el){
      return function(){
        el.remove();
      };
    }(h),10500);
  }
}

hearts(12);

/* Continuous hearts — optimized */

var ambientHeartTimer=setInterval(function(){
  hearts(2);
},2200);

var finalHeartTimer=null;

/* PAGE NAVIGATION */

function go(n){

  for(var i=0;i<=5;i++){
    document.getElementById('s'+i).classList.add('hide');
  }

  document.getElementById('s'+n).classList.remove('hide');

  window.scrollTo(0,0);
  hearts(18);

  if(n==1) setBg('');

  if(n==2){
    setBg('A');
    showLetter();
  }

  if(n==3){
    setBg('D');
    showReasons();
  }

  if(n==4) setBg('E');

  if(n==5){
    setBg('');
    buildCollage();
    hearts(45);

    if(!finalHeartTimer){
      finalHeartTimer=setInterval(function(){
        hearts(5);
      },1400);
    }

  }else if(finalHeartTimer){
    clearInterval(finalHeartTimer);
    finalHeartTimer=null;
  }
}

/* LETTER */

function showLetter(){

  var box=document.getElementById('letter');
  box.innerHTML='';

  PARAS.forEach(function(t,k){

    var p=document.createElement('p');
    p.className='p';
    p.textContent=t;

    box.appendChild(p);

    setTimeout(function(){

      p.classList.add('show');

      setBg(k<3?'A':(k<6?'B':'C'));

    },1800*k+300);
  });

  setTimeout(function(){
    document.getElementById('n2').classList.add('show');
  },1800*PARAS.length+500);
}

/* REASONS */

function showReasons(){

  var ul=document.getElementById('reasons');
  ul.innerHTML='';

  REASONS.forEach(function(t,k){

    var li=document.createElement('li');
    li.textContent=t;
    ul.appendChild(li);

    setTimeout(function(){
      li.classList.add('show');
    },1200*k+300);
  });

  setTimeout(function(){
    document.getElementById('n3').classList.add('show');
  },1200*REASONS.length+500);
}

/* FINAL COLLAGE */

var built=false;

function buildCollage(){

  if(built) return;
  built=true;

  var c=document.getElementById('collage');

  var items=[
    {k:'A',r:-4,p:'55% 30%'},
    {k:'B',r:3,p:'40% 30%'},
    {v:1,r:-2,big:1},
    {k:'E',r:4,p:'50% 30%'},
    {k:'D',r:-3,p:'50% 50%'},
    {k:'F',r:-4,p:'50% 40%'}
  ];

  items.forEach(function(it,i){

    var d=document.createElement('div');

    d.className='pol'+
      (it.big?' big':'')+
      (it.wide?' wide':'');

    d.style.setProperty('--r',it.r+'deg');
    d.style.setProperty('--d',(0.25*i)+'s');

    if(it.v){

      var v=document.createElement('video');

      v.src=VIDEO;
      v.muted=true;
      v.loop=true;
      v.autoplay=true;
      v.playsInline=true;

      v.setAttribute('playsinline','');
      v.setAttribute('muted','');

      d.appendChild(v);

      setTimeout(function(){
        v.play().catch(function(){});
      },300);

      d.onclick=function(){
        v.play().catch(function(){});
      };

    }else{

      var im=document.createElement('img');

      im.src=IMGS[it.k];
      im.style.objectPosition=it.p;
      im.alt='';

      d.appendChild(im);
    }

    c.appendChild(d);
  });
}

/* NO BUTTON — MOBILE FIX */

var noLines=[
  "No",
  "Yaaru antha ponnu? 😤",
  "Kondruven 😠",
  "Pidikka mudiyaadhu 🏃",
  "Odatha da 😂"
];

var nl=0;
var sc=1;

function dodge(e){

  // Prevent duplicate mobile touch events
  if(e && e.type==='mouseenter' && ('ontouchstart' in window)){
    return;
  }

  if(e) e.preventDefault();

  var a=document.getElementById('arena');
  var no=document.getElementById('no');

  no.style.left=Math.random()*(a.clientWidth-no.offsetWidth)+'px';
  no.style.top=Math.random()*(a.clientHeight-no.offsetHeight)+'px';

  nl=(nl+1)%noLines.length;
  no.textContent=noLines[nl];

  sc=Math.min(sc+.1,1.6);

  document.getElementById('ok').style.transform='scale('+sc+')';
}

var noBtn=document.getElementById('no');

noBtn.addEventListener('mouseenter',dodge);
noBtn.addEventListener('click',dodge);

</script>
</body>
</html>
